name: OSM place check (temporary)
on:
  push:
    branches: [diag/osm-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          for q in ['紅色琉璃瓦草莓園', '紅色琉璃瓦', 'SUHU Café', 'SUHU 大湖', '大湖 草莓園']:
            url = 'https://photon.komoot.io/api/?' + urllib.parse.urlencode({'q': q, 'limit': 5, 'bbox': '119.3,21.8,122.1,25.4'})
            try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'little-orbit-check/1.0'}), timeout=30) as r: data = json.load(r)
              names = [f"{f['properties'].get('name')} ({f['properties'].get('city') or f['properties'].get('county') or ''})" for f in data.get('features', [])]
            except Exception as e: names = [type(e).__name__]
            print('::notice title=' + q + '::' + ('; '.join(names) or 'no results'))
          PY
