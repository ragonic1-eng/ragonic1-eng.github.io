name: Orbit live check
# Manual end-to-end check of the deployed Orbit function: creates a small private test trip
# with the public site key, then makes one research request and one plan check (two Qwen calls).
on:
  workflow_dispatch:
    inputs:
      logs_only:
        description: Only read recent Orbit errors (no Qwen calls)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPERBASE_SEC || secrets.SUPERBASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: iqpljuxtjngcisvokjkm
    steps:
      - uses: actions/checkout@v4
      - name: Research a place and check a plan
        if: ${{ !inputs.logs_only }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          config = json.load(open('config.json'))
          base, key = config['supabaseUrl'].rstrip('/'), config['supabaseKey']
          def post(url, body):
            request = urllib.request.Request(url, method='POST', data=json.dumps(body).encode(), headers={
              'apikey': key, 'Content-Type': 'application/json', 'User-Agent': 'little-orbit-check/1.0'})
            try:
              with urllib.request.urlopen(request, timeout=90) as response: return response.status, json.load(response)
            except urllib.error.HTTPError as e:
              text = e.read().decode('utf-8', 'replace')
              try: return e.code, json.loads(text)
              except ValueError: return e.code, {'error': text[:300]}
          def note(level, title, message): print(f'::{level} title={title}::' + ' '.join(str(message).split())[:900])
          status, trip = post(base + '/rest/v1/rpc/orbit_create_trip', {'p_trip': json.load(open('trip.json'))})
          if status != 200 or 'id' not in trip: note('error', 'Test trip', f'HTTP {status}: {trip}'); raise SystemExit(1)
          room = {'roomId': trip['id'], 'roomKey': trip['key']}
          function = base + '/functions/v1/research-place'
          status, research = post(function, {**room, 'query': 'Taipei Zoo, Wenshan District, Taipei', 'country': 'tw'})
          places = research.get('places') or []
          if status == 200 and places:
            p = places[0]
            note('notice', 'Research OK', f"{p.get('name')} | {p.get('address')} | hours: {p.get('openingHours') or '-'} | planning: {p.get('planning')} | sources: {len(p.get('sources') or [])}")
          else: note('error', 'Research failed', f"HTTP {status}: {research}")
          plan = {'place': {'name': 'Taipei Zoo', 'address': 'No. 30, Sec. 2, Xinguang Rd, Taipei', 'openingHours': 'Daily 09:00-17:00'}, 'date': '2026-12-12', 'start': '14:00', 'end': '16:00',
                  'previous': {'title': 'Lunch at LOCOFOOD', 'place': '', 'leaveAt': '13:30', 'travelMinutes': 25, 'km': 12.5},
                  'next': {'title': 'Jolley Hotel check-in', 'place': 'Jolley Hotel', 'startsAt': '16:30', 'travelMinutes': 30, 'km': 14}}
          status, check = post(function, {**room, 'action': 'evaluate', 'plan': plan})
          if status == 200 and check.get('evaluation'): note('notice', 'Plan check OK', json.dumps(check['evaluation'], ensure_ascii=False))
          else: note('error', 'Plan check failed', f"HTTP {status}: {check}")
          if not (places and check.get('evaluation')): raise SystemExit(1)
          PY
      - name: Recent Orbit errors from Supabase logs
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get('SUPABASE_ACCESS_TOKEN')
          if not token: print('No Supabase access token; skipping logs.'); raise SystemExit(0)
          import datetime, urllib.error
          clean = lambda v: ' '.join(str(v).replace(token, '[redacted]').split())[:900]
          now = datetime.datetime.now(datetime.timezone.utc)
          sql = "select timestamp, source, event_message from logs where event_message like '%orbit%' order by timestamp desc limit 8"
          url = f"https://api.supabase.com/v1/projects/{os.environ['SUPABASE_PROJECT_REF']}/analytics/endpoints/logs?" + urllib.parse.urlencode({'sql': sql, 'iso_timestamp_start': (now - datetime.timedelta(hours=3)).strftime('%Y-%m-%dT%H:%M:%S.000Z'), 'iso_timestamp_end': now.strftime('%Y-%m-%dT%H:%M:%S.000Z')})
          try:
            request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'User-Agent': 'little-orbit-check/1.0'})
            with urllib.request.urlopen(request, timeout=30) as response: data = json.load(response)
            rows = data.get('result') or []
            if data.get('error'): print('::warning title=Log query::' + clean(data['error']))
            for row in rows: print('::warning title=Orbit log::' + clean(row.get('event_message')))
            if not rows: print('::notice title=Orbit log::No Orbit errors logged in the last 3 hours.')
          except urllib.error.HTTPError as e: print('::warning title=Log query::HTTP ' + str(e.code) + ' ' + clean(e.read().decode('utf-8', 'replace')))
          except Exception as e: print('::warning title=Log query::' + type(e).__name__ + ' ' + clean(e))
          PY
