name: Deploy Qwen place research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/research.sql'
      - 'supabase/config.toml'
      - '.github/workflows/research.yml'
permissions:
  contents: read
concurrency:
  group: qwen-place-research
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPERBASE_SEC || secrets.SUPERBASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: iqpljuxtjngcisvokjkm
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Add SUPABASE_ACCESS_TOKEN to repository Actions secrets, then re-run this workflow. DASHSCOPE_API_KEY (the Qwen key) stays in Supabase Edge Function secrets.'
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply private research cache and usage limits
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          url = 'https://api.supabase.com/v1/projects/' + os.environ['SUPABASE_PROJECT_REF'] + '/database/query'
          request = urllib.request.Request(url, method='POST', headers={
            'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json'
          }, data=json.dumps({'query': pathlib.Path('supabase/research.sql').read_text()}).encode())
          try:
            with urllib.request.urlopen(request, timeout=60) as response:
              if not 200 <= response.status < 300: raise RuntimeError('Migration did not succeed: HTTP ' + str(response.status))
            print('Research schema installed')
          except urllib.error.HTTPError as e:
            detail = e.read().decode('utf-8', 'replace').replace(os.environ['SUPABASE_ACCESS_TOKEN'], '[redacted]')
            print('Supabase schema diagnostic: ' + detail[:1200])
            raise SystemExit('Supabase schema deployment failed with HTTP ' + str(e.code) + '. Check project permissions and the existing shared-trip setup.')
          PY
      - name: Deploy secured edge function
        run: supabase functions deploy research-place --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Verify function and server-side key readiness
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://' + os.environ['SUPABASE_PROJECT_REF'] + '.supabase.co/functions/v1/research-place'
          for attempt in range(6):
            try:
              with urllib.request.urlopen(url, timeout=15) as response: status = json.load(response)
              if status.get('available') is True:
                print('Qwen function is deployed (model ' + str(status.get('model')) + ') and its API key is configured. Live provider research still needs a private-trip request.')
                break
              raise RuntimeError('DASHSCOPE_API_KEY is missing from Supabase Edge Function secrets')
            except Exception:
              if attempt == 5: raise SystemExit('Function readiness check failed. Check function deployment and DASHSCOPE_API_KEY (or QWEN_API_KEY) in Supabase secrets.')
              time.sleep(5)
          PY
