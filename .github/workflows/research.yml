name: Deploy Claude place research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/research.sql'
      - 'supabase/config.toml'
      - '.github/workflows/research.yml'
permissions:
  contents: read
concurrency:
  group: claude-place-research
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPERBASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: iqpljuxtjngcisvokjkm
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment access
        env:
          SECRET_METADATA_INPUT: ${{ toJSON(secrets) }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            python3 - <<'PYMETA'
          import json, os
          names = [name for name in json.loads(os.environ['SECRET_METADATA_INPUT']) if name.startswith(('SUPA', 'SUPER'))]
          print('Supabase-related secret names (values omitted): ' + ', '.join(sorted(names)))
          PYMETA
            echo 'Add SUPABASE_ACCESS_TOKEN to repository Actions secrets, then re-run this workflow. ANTHROPIC_API_KEY stays in Supabase Edge Function secrets.'
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply private research cache and usage limits
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          url = 'https://api.supabase.com/v1/projects/' + os.environ['SUPABASE_PROJECT_REF'] + '/database/query'
          request = urllib.request.Request(url, method='POST', headers={
            'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'], 'Content-Type': 'application/json'
          }, data=json.dumps({'query': pathlib.Path('supabase/research.sql').read_text()}).encode())
          try:
            with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 200: raise RuntimeError('Migration did not succeed')
            print('Research schema installed')
          except urllib.error.HTTPError as e:
            raise SystemExit('Supabase schema deployment failed with HTTP ' + str(e.code) + '. Check project permissions and the existing shared-trip setup.')
          PY
      - name: Deploy secured edge function
        run: supabase functions deploy research-place --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Verify function and server-side key readiness
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://' + os.environ['SUPABASE_PROJECT_REF'] + '.supabase.co/functions/v1/research-place'
          for attempt in range(6):
            try:
              with urllib.request.urlopen(url, timeout=15) as response: status = json.load(response)
              if status.get('available') is True:
                print('Claude function is deployed and ANTHROPIC_API_KEY is configured. Live provider research still needs a private-trip request.')
                break
              raise RuntimeError('ANTHROPIC_API_KEY is missing from Supabase Edge Function secrets')
            except Exception:
              if attempt == 5: raise SystemExit('Function readiness check failed. Check function deployment and ANTHROPIC_API_KEY in Supabase secrets.')
              time.sleep(5)
          PY
