name: Deploy Orbit place research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/research.sql'
      - 'supabase/setup.sql'
      - 'supabase/google.sql'
      - 'supabase/chat.sql'
      - 'supabase/config.toml'
      - '.github/workflows/research.yml'
permissions:
  contents: read
concurrency:
  group: orbit-place-research
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPERBASE_SEC || secrets.SUPERBASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: iqpljuxtjngcisvokjkm
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo 'Add SUPABASE_ACCESS_TOKEN to repository Actions secrets, then re-run this workflow. DASHSCOPE_API_KEY (the Qwen key) stays in Supabase Edge Function secrets.'
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply shared-trip database and Orbit research tables
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          def fail(message):
            # Annotations stay readable even when raw logs can't be downloaded; never include the token.
            clean = ' '.join(message.replace(token, '[redacted]').split())[:900]
            print('::error title=Supabase schema deployment::' + clean)
            raise SystemExit(1)
          url = 'https://api.supabase.com/v1/projects/' + os.environ['SUPABASE_PROJECT_REF'] + '/database/query'
          # An explicit User-Agent: Cloudflare in front of the API can reject Python's default one.
          # setup.sql (shared trips) must exist before research.sql; both are safe to re-run.
          for name in ['supabase/setup.sql', 'supabase/research.sql', 'supabase/google.sql', 'supabase/chat.sql']:
            request = urllib.request.Request(url, method='POST', headers={
              'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'User-Agent': 'little-orbit-deploy/1.0'
            }, data=json.dumps({'query': pathlib.Path(name).read_text()}).encode())
            try:
              with urllib.request.urlopen(request, timeout=60) as response:
                if not 200 <= response.status < 300: fail(name + ': unexpected HTTP ' + str(response.status))
              print('Applied ' + name)
            except urllib.error.HTTPError as e:
              fail(name + ': HTTP ' + str(e.code) + ': ' + e.read().decode('utf-8', 'replace'))
            except Exception as e:
              fail(name + ': ' + type(e).__name__ + ': ' + str(e))
          PY
      - name: Deploy secured edge function
        run: |
          supabase functions deploy research-place --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy google-places --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy orbit-chat --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Verify function and server-side key readiness
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://' + os.environ['SUPABASE_PROJECT_REF'] + '.supabase.co/functions/v1/research-place'
          for attempt in range(6):
            try:
              with urllib.request.urlopen(url, timeout=15) as response: status = json.load(response)
              if status.get('available') is True:
                print('Orbit (Qwen) function is deployed (model ' + str(status.get('model')) + ') and its API key is configured. Live provider research still needs a private-trip request.')
                break
              raise RuntimeError('DASHSCOPE_API_KEY is missing from Supabase Edge Function secrets')
            except Exception:
              if attempt == 5: raise SystemExit('Function readiness check failed. Check function deployment and DASHSCOPE_API_KEY (or QWEN_API_KEY) in Supabase secrets.')
              time.sleep(5)
          PY
      - name: Check Google Maps search readiness
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://' + os.environ['SUPABASE_PROJECT_REF'] + '.supabase.co/functions/v1/google-places'
          with urllib.request.urlopen(url, timeout=15) as response: status = json.load(response)
          if status.get('available') is True: print('::notice title=Google Maps::google-places is deployed and GOOGLE_MAPS_API_KEY is set.')
          else: print('::warning title=Google Maps::google-places is deployed, but GOOGLE_MAPS_API_KEY is not in Supabase Edge Function secrets yet. Search falls back to the free map until it is.')
          PY
